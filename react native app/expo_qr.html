<!DOCTYPE html>

<head>
  <meta charset="utf-8">
  <title>Expo QR Code - Smart City IoT</title>
  <style>
    body {
      background: #0f172a;
      color: #f8fafc;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      margin: 0;
      padding: 20px;
    }
    .card {
      background: #1e293b;
      padding: 32px;
      border-radius: 16px;
      box-shadow: 0 10px 25px rgba(0,0,0,0.5);
      text-align: center;
      max-width: 420px;
    }
    .qr-container {
      background: white;
      padding: 16px;
      border-radius: 12px;
      display: inline-block;
      margin: 20px 0;
    }
    .url {
      background: #0f172a;
      padding: 10px 16px;
      border-radius: 8px;
      font-family: monospace;
      color: #38bdf8;
      font-size: 15px;
      word-break: break-all;
    }
    p { color: #94a3b8; font-size: 14px; margin: 8px 0; }
    h2 { margin: 0 0 8px 0; color: #f8fafc; }
  </style>
</head>
